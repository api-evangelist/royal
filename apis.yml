description: Royal is a music-and-crypto company backed by a16z and Paradigm that originally let fans buy tokenized shares of songs (Limited Digital Assets, or LDAs) so they could earn streaming royalties alongside the artists they support. As of mid-2026 the public site at royal.io states the company is "reinventing itself" and is between products, keeping only its legal pages and LDA support live; it publishes no developer portal, documentation, OpenAPI, SDKs, or public API surface at this time. This profile tracks Royal as an API Evangelist network company and will be enriched further if and when a public API or developer program appears.
